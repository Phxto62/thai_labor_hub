<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Jobs - Thai Labor Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <nav class="bg-blue-900 text-white p-4 sticky top-0 z-50 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold italic">THAI LABOR HUB</h1>
            <div class="space-x-4 text-sm flex items-center">
                <a href="index.html" class="hover:text-yellow-400">Home</a>
                <a href="jobs.html" class="text-yellow-400 font-bold border-b-2 border-yellow-400">Find Jobs</a>
                
                <a href="login.html" id="login-link" class="hover:text-yellow-400">Login</a>
                
                <a href="register.html" id="auth-btn" class="bg-yellow-500 text-blue-900 px-4 py-1.5 rounded-full font-bold hover:bg-white transition">
                    Register
                </a>
            </div>
        </div>
    </nav>

    <section class="container mx-auto py-12 px-6">
        <h3 class="text-3xl font-bold mb-8">Current Job Openings</h3>
        <div id="job-container" class="grid md:grid-cols-2 gap-8">
            </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ONLY DECLARE THIS ONCE
    const SUPABASE_URL = 'https://sagggctrodrqymbzjbem.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_-R2-f75QkYfFcNiGDgQiyQ_bB0zk1nZ'; // Use your real anon key
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Navbar logic
    const user = JSON.parse(localStorage.getItem('workerUser'));
    if (user) {
        const authBtn = document.getElementById('auth-btn');
        if(authBtn) {
            authBtn.innerText = 'Profile';
            authBtn.href = 'profile.html';
        }
        const loginLink = document.getElementById('login-link');
        if(loginLink) loginLink.classList.add('hidden');
    }

    async function fetchJobs() {
        // We use the supabaseClient declared at the top of your script
        const { data: jobs, error } = await supabaseClient
            .from('jobs')
            .select('*');

        if (error) {
            console.error("Error fetching jobs:", error.message);
            return;
        }

        const container = document.getElementById('job-container');
        
        if (jobs && jobs.length > 0) {
            container.innerHTML = jobs.map(job => `
                <div class="bg-white p-6 rounded-lg shadow-md border-l-4 border-blue-900 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <h4 class="text-xl font-bold text-blue-900">${job.title}</h4>
                            <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2.5 py-0.5 rounded">Full-time</span>
                        </div>
                        
                        <p class="text-gray-500 text-sm mb-3">
                            <i class="fas fa-map-marker-alt mr-1"></i> ${job.location}
                        </p>

                        <p class="text-gray-500 text-sm mb-3">
                            <i class="fas fa-info-circle mr-1"></i> ${job.detail || 'No additional details provided.'}
                        </p>
                        
                        <p class="text-green-700 font-bold text-lg mb-3">
                            ${job.salary} baht per day
                        </p>
                    </div>

                    <button onclick="applyJob(${job.id})" class="w-full bg-blue-900 text-white px-6 py-2 rounded-full text-sm font-bold hover:bg-black transition shadow-md">
                        Apply Now
                    </button>
                </div>
            `).join('');
        } else {
            container.innerHTML = `<p class="text-gray-500 text-center py-10">No jobs found in the database.</p>`;
        }
    }

    async function applyJob(jobId) {
        if (!user || !user.id) {
            alert("Please register first!");
            window.location.href = 'register.html';
            return;
        }

        const { error } = await supabaseClient
            .from('applications')
            .insert([{ worker_id: user.id, job_id: jobId }]);

        if (error) alert("Error: " + error.message);
        else alert("Application sent!");
    }

    fetchJobs();
</script>

<script>
    // 1. Check if a worker is logged in
    const loggedInUser = JSON.parse(localStorage.getItem('workerUser'));

    // 2. Find the buttons we want to change
    // Make sure your Register button has id="auth-btn"
    // Make sure your Login link has id="login-link"
    const authBtn = document.getElementById('auth-btn');
    const loginLink = document.getElementById('login-link');

    if (loggedInUser && authBtn) {
        // Change "Register" to "Profile"
        authBtn.innerText = 'Profile';
        authBtn.href = 'profile.html';
        authBtn.classList.add('bg-yellow-500'); // Optional: change color to show logged in
        
        // Hide the Login link if it exists
        if (loginLink) {
            loginLink.style.display = 'none';
        }
    }
</script>

</body>
</html>

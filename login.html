<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Thai Labor Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex flex-col min-h-screen">
    
    <nav class="bg-blue-900 text-white p-4 w-full">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold italic">THAI LABOR HUB</h1>
            <a href="index.html" class="hover:text-yellow-400">Home</a>
        </div>
    </nav>

    <div class="flex-grow flex items-center justify-center p-6">
        <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-blue-900">Worker Login</h2>
                <p class="text-gray-500">Welcome back to Thai Labor Hub</p>
            </div>
            
            <form id="loginForm" class="space-y-4">
                <input id="loginPhone" type="text" placeholder="Phone Number" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-900" required>
                <input id="loginPassword" type="password" placeholder="Password" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-900" required>
                <button type="submit" class="w-full bg-blue-900 text-white py-3 rounded-lg font-bold hover:bg-black transition">
                    Login
                </button>
            </form>
            
            <p class="text-center mt-6 text-sm">
                Don't have an account? <a href="register.html" class="text-blue-700 font-bold">Register here</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://sagggctrodrqymbzjbem.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_-R2-f75QkYfFcNiGDgQiyQ_bB0zk1nZ'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const { data, error } = await supabaseClient
                    .from('workers')
                    .select('*')
                    .eq('phone', phone)
                    .eq('password', password)
                    .single();

                if (error || !data) {
                    alert("Invalid phone number or password.");
                    console.log("Login error:", error);
                } else {
                    localStorage.setItem('workerUser', JSON.stringify(data));
                    alert("Welcome back, " + data.name + "!");
                    window.location.href = 'profile.html';
                }
            } catch (err) {
                console.error("Login System Error:", err);
            }
        };
    </script>
</body>
</html>
